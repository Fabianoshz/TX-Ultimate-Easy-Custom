switch:
  - platform: template
    name: "Virtual Switch 1"
    id: virtual_switch_1
    internal: ${gang_count < 1}
    lambda: "return id(virtual_state_1);"
    turn_on_action:
      - globals.set:
          id: virtual_state_1
          value: "true"
      - lambda: |-
          auto now = id(device_time).now();
          bool is_night = now.is_valid() && (now.hour >= 20 || now.hour < 6);
          float r = is_night ? id(vs_on_n_r) : id(vs_on_r);
          float g = is_night ? id(vs_on_n_g) : id(vs_on_g);
          float b = is_night ? id(vs_on_n_b) : id(vs_on_b);
          float bri = is_night ? id(vs_on_n_bri) : id(vs_on_bri);
          if (0 < id(gb_lights_1).size()) {
            auto &v = id(gb_lights_1)[0]->current_values;
            id(vs1_g1_r) = v.get_red();
            id(vs1_g1_g) = v.get_green();
            id(vs1_g1_b) = v.get_blue();
            id(vs1_g1_bri) = v.get_brightness();
            id(vs1_g1_on) = v.is_on();
            auto call = id(gb_lights_1)[0]->turn_on();
            call.set_rgb(r, g, b);
            call.set_brightness(bri);
            call.perform();
          }
          if (0 < id(gb_lights_2).size()) {
            auto &v = id(gb_lights_2)[0]->current_values;
            id(vs1_g2_r) = v.get_red();
            id(vs1_g2_g) = v.get_green();
            id(vs1_g2_b) = v.get_blue();
            id(vs1_g2_bri) = v.get_brightness();
            id(vs1_g2_on) = v.is_on();
            auto call = id(gb_lights_2)[0]->turn_on();
            call.set_rgb(r, g, b);
            call.set_brightness(bri);
            call.perform();
          }
    turn_off_action:
      - globals.set:
          id: virtual_state_1
          value: "false"
      - lambda: |-
          auto now = id(device_time).now();
          bool is_night = now.is_valid() && (now.hour >= 20 || now.hour < 6);
          float r = is_night ? id(vs_off_n_r) : id(vs_off_r);
          float g = is_night ? id(vs_off_n_g) : id(vs_off_g);
          float b = is_night ? id(vs_off_n_b) : id(vs_off_b);
          float bri = is_night ? id(vs_off_n_bri) : id(vs_off_bri);
          if (0 < id(gb_lights_1).size()) {
            if (bri <= 0.0f) {
              id(gb_lights_1)[0]->turn_off().perform();
            } else {
              auto call = id(gb_lights_1)[0]->turn_on();
              call.set_rgb(r, g, b);
              call.set_brightness(bri);
              call.perform();
            }
          }
          if (0 < id(gb_lights_2).size()) {
            if (bri <= 0.0f) {
              id(gb_lights_2)[0]->turn_off().perform();
            } else {
              auto call = id(gb_lights_2)[0]->turn_on();
              call.set_rgb(r, g, b);
              call.set_brightness(bri);
              call.perform();
