          value: "false"
      - lambda: |-
          auto now = id(device_time).now();
          bool is_night = now.is_valid() && (now.hour >= 20 || now.hour < 6);
          float r = is_night ? id(vs_off_n_r) : id(vs_off_r);
          float g = is_night ? id(vs_off_n_g) : id(vs_off_g);
          float b = is_night ? id(vs_off_n_b) : id(vs_off_b);
          float bri = is_night ? id(vs_off_n_bri) : id(vs_off_bri);
          if (3 < id(gb_lights_1).size()) {
            if (bri <= 0.0f) {
              id(gb_lights_1)[3]->turn_off().perform();
            } else {
              auto call = id(gb_lights_1)[3]->turn_on();
              call.set_rgb(r, g, b);
              call.set_brightness(bri);
              call.perform();
            }
          }
          if (3 < id(gb_lights_2).size()) {
            if (bri <= 0.0f) {
              id(gb_lights_2)[3]->turn_off().perform();
            } else {
              auto call = id(gb_lights_2)[3]->turn_on();
              call.set_rgb(r, g, b);
              call.set_brightness(bri);
              call.perform();
            }
          }
