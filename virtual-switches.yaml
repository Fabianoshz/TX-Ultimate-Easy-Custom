substitutions:
  virtual_switch_on_red: "0.0"
  virtual_switch_on_green: "0.2"
  virtual_switch_on_blue: "0.6"
  virtual_switch_on_brightness: "0.20"

output:
  - platform: template
    id: vs_on_red_out
    type: float
    write_action:
      - lambda: return;
  - platform: template
    id: vs_on_green_out
    type: float
    write_action:
      - lambda: return;
  - platform: template
    id: vs_on_blue_out
    type: float
    write_action:
      - lambda: return;
  - platform: template
    id: vs_off_red_out
    type: float
    write_action:
      - lambda: return;
  - platform: template
    id: vs_off_green_out
    type: float
    write_action:
      - lambda: return;
  - platform: template
    id: vs_off_blue_out
    type: float
    write_action:
      - lambda: return;

light:
  - platform: rgb
    name: "Virtual Switch On Color"
    id: vs_on_light
    red: vs_on_red_out
    green: vs_on_green_out
    blue: vs_on_blue_out
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 0ms
    on_state:
      then:
        - lambda: |-
            auto v = id(vs_on_light).current_values;
            if (v.get_brightness() > 0.0f) {
              id(vs_on_r) = v.get_red();
              id(vs_on_g) = v.get_green();
              id(vs_on_b) = v.get_blue();
              id(vs_on_bri) = v.get_brightness();
            }

  - platform: rgb
    name: "Virtual Switch Off Color"
    id: vs_off_light
    red: vs_off_red_out
    green: vs_off_green_out
    blue: vs_off_blue_out
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 0ms
    on_state:
      then:
        - lambda: |-
            auto v = id(vs_off_light).current_values;
            if (v.get_brightness() > 0.0f) {
              id(vs_off_r) = v.get_red();
              id(vs_off_g) = v.get_green();
              id(vs_off_b) = v.get_blue();
              id(vs_off_bri) = v.get_brightness();
            }

script:
  - id: !extend button_action
    parameters:
      button: uint8_t
      action: string
      count: uint8_t
    then:
      - lambda: |-
          if (action != "click" || count != 1) {
            return;
          }
          switch (button) {
            case 1:
              if (${gang_count} >= 1) id(virtual_switch_1).toggle();
              break;
            case 2:
              if (${gang_count} >= 2) id(virtual_switch_2).toggle();
              break;
            case 3:
              if (${gang_count} >= 3) id(virtual_switch_3).toggle();
              break;
            case 4:
              if (${gang_count} >= 4) id(virtual_switch_4).toggle();
              break;
          }

globals:
  - id: vs_on_r
    type: float
    restore_value: true
    initial_value: ${virtual_switch_on_red}
  - id: vs_on_g
    type: float
    restore_value: true
    initial_value: ${virtual_switch_on_green}
  - id: vs_on_b
    type: float
    restore_value: true
    initial_value: ${virtual_switch_on_blue}
  - id: vs_on_bri
    type: float
    restore_value: true
    initial_value: ${virtual_switch_on_brightness}

  - id: vs_off_r
    type: float
    restore_value: true
    initial_value: "1.0"
  - id: vs_off_g
    type: float
    restore_value: true
    initial_value: "1.0"
