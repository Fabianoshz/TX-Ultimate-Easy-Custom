substitutions:
  virtual_switch_on_red: "0.0"
  virtual_switch_on_green: "0.2"
  virtual_switch_on_blue: "0.6"
  virtual_switch_on_brightness: "0.20"

output:
  - platform: template
    id: vs_on_red_out
    type: float
    write_action:
      - lambda: return;
  - platform: template
    id: vs_on_green_out
    type: float
    write_action:
      - lambda: return;
  - platform: template
    id: vs_on_blue_out
    type: float
    write_action:
      - lambda: return;
  - platform: template
    id: vs_off_red_out
    type: float
    write_action:
      - lambda: return;
  - platform: template
    id: vs_off_green_out
    type: float
    write_action:
      - lambda: return;
  - platform: template
    id: vs_off_blue_out
    type: float
    write_action:
      - lambda: return;

  - platform: template
    id: vs_on_n_red_out
    type: float
    write_action:
      - lambda: return;
  - platform: template
    id: vs_on_n_green_out
    type: float
    write_action:
      - lambda: return;
  - platform: template
    id: vs_on_n_blue_out
    type: float
    write_action:
      - lambda: return;
  - platform: template
    id: vs_off_n_red_out
    type: float
    write_action:
      - lambda: return;
  - platform: template
    id: vs_off_n_green_out
    type: float
    write_action:
      - lambda: return;
  - platform: template
    id: vs_off_n_blue_out
    type: float
    write_action:
      - lambda: return;

light:
  - platform: rgb
    name: "Virtual Switch On Color"
    id: vs_on_light
    red: vs_on_red_out
    green: vs_on_green_out
    blue: vs_on_blue_out
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 0ms
    on_state:
      then:
        - lambda: |-
            auto v = id(vs_on_light).current_values;
            if (v.get_brightness() > 0.0f) {
              id(vs_on_r) = v.get_red();
              id(vs_on_g) = v.get_green();
              id(vs_on_b) = v.get_blue();
              id(vs_on_bri) = v.get_brightness();
            }

  - platform: rgb
    name: "Virtual Switch Off Color"
    id: vs_off_light
    red: vs_off_red_out
    green: vs_off_green_out
    blue: vs_off_blue_out
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 0ms
    on_state:
      then:
        - lambda: |-
            auto v = id(vs_off_light).current_values;
            if (v.get_brightness() > 0.0f) {
              id(vs_off_r) = v.get_red();
              id(vs_off_g) = v.get_green();
              id(vs_off_b) = v.get_blue();
              id(vs_off_bri) = v.get_brightness();
            }

  - platform: rgb
    name: "Virtual Switch On Color Night"
    id: vs_on_light_night
    red: vs_on_n_red_out
    green: vs_on_n_green_out
    blue: vs_on_n_blue_out
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 0ms
    on_state:
      then:
        - lambda: |-
            auto v = id(vs_on_light_night).current_values;
            if (v.get_brightness() > 0.0f) {
              id(vs_on_n_r) = v.get_red();
              id(vs_on_n_g) = v.get_green();
              id(vs_on_n_b) = v.get_blue();
              id(vs_on_n_bri) = v.get_brightness();
            }

  - platform: rgb
    name: "Virtual Switch Off Color Night"
    id: vs_off_light_night
    red: vs_off_n_red_out
    green: vs_off_n_green_out
    blue: vs_off_n_blue_out
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 0ms
    on_state:
      then:
        - lambda: |-
            auto v = id(vs_off_light_night).current_values;
            if (v.get_brightness() > 0.0f) {
              id(vs_off_n_r) = v.get_red();
              id(vs_off_n_g) = v.get_green();
              id(vs_off_n_b) = v.get_blue();
              id(vs_off_n_bri) = v.get_brightness();
            }

  # Covers the entire strip. Used as a night-time background wash so the LEDs
  # that no gang owns are lit too; painted before the per-gang segments, which
  # then overwrite their own LEDs in the same buffer.
  - platform: partition
    name: "Virtual Switch Fill"
    id: vs_fill_light
    internal: true
    restore_mode: ALWAYS_OFF
    default_transition_length: 0ms
    segments:
      - id: light_full
        from: 0
        to: 31

time:
  - platform: homeassistant
    id: device_time
    timezone: America/Sao_Paulo
    on_time_sync:
      then:
        - script.execute: vs_paint_lights

# Repaint on a timer rather than only at the window edges, so a missed trigger,
# a reboot or an external write to the strip self-heals within one interval.
interval:
  - interval: 2min
    then:
      - script.execute: vs_paint_lights

select:
  # Auto follows the clock; On/Off pin a palette, which is also the only way to
  # see the night palette without waiting for the night window.
  - platform: template
    name: "Night Mode"
    id: night_mode
    options:
      - "Auto"
      - "On"
      - "Off"
    initial_option: "Auto"
    optimistic: true
    restore_value: true
    entity_category: config
    icon: mdi:weather-night
    on_value:
      then:
        - script.execute: vs_paint_lights

number:
  - platform: template
    name: "Night Mode Start Hour"
    id: night_start_hour
    optimistic: true
    restore_value: true
    initial_value: 20
    min_value: 0
    max_value: 23
    step: 1
    mode: box
    entity_category: config
    icon: mdi:weather-sunset-down
    on_value:
      then:
        - script.execute: vs_paint_lights

  - platform: template
    name: "Night Mode End Hour"
    id: night_end_hour
    optimistic: true
    restore_value: true
    initial_value: 8
    min_value: 0
    max_value: 23
    step: 1
    mode: box
    entity_category: config
    icon: mdi:weather-sunset-up
    on_value:
      then:
        - script.execute: vs_paint_lights

script:
  # Single painter for every LED on the panel. Inside the night window the night
  # palette replaces the day one and washes the whole strip; the per-gang segments
  # are then drawn on top so each relay keeps its own on/off indication.
  # Every write happens in one lambda, so the strip is shown once and never flickers.
  - id: vs_paint_lights
    mode: restart
    then:
      - lambda: |-
          // The select/number on_value triggers fire while their own components are
          // still setting up, so painting has to wait for the LED and relay groups.
          if (!id(bs_boot_completed)->state) return;

          // A colour of 0,0,0 is not "off" to ESPHome: normalize_color() rewrites an
          // all-zero RGB to white, so a zero colour must be painted as turn_off().
          auto is_dark = [](float r, float g, float b, float bri) -> bool {
            return bri <= 0.0f || (r <= 0.0f && g <= 0.0f && b <= 0.0f);
          };

          bool is_night;
          const std::string mode = id(night_mode).current_option();
          if (mode == "On") {
            is_night = true;
          } else if (mode == "Off") {
            is_night = false;
          } else {
            const auto now = id(device_time).now();
            // Fall back to 20 -> 8 if a number has no state yet (state is NaN).
            const float start_f = id(night_start_hour).state;
            const float end_f = id(night_end_hour).state;
            const int start = std::isnan(start_f) ? 20 : (int) start_f;
            const int end = std::isnan(end_f) ? 8 : (int) end_f;
            // start > end means the window crosses midnight (the usual 20 -> 8).
            is_night = now.is_valid() && (start > end ? (now.hour >= start || now.hour < end)
                                                     : (now.hour >= start && now.hour < end));
          }

          // Background wash: night "off" colour at night, dark during the day.
          if (is_night && !is_dark(id(vs_off_n_r), id(vs_off_n_g), id(vs_off_n_b), id(vs_off_n_bri))) {
            auto call = id(vs_fill_light).turn_on();
            call.set_rgb(id(vs_off_n_r), id(vs_off_n_g), id(vs_off_n_b));
            call.set_brightness(id(vs_off_n_bri));
            call.set_transition_length(0);
            call.perform();
          } else {
            auto call = id(vs_fill_light).turn_off();
            call.set_transition_length(0);
            call.perform();
          }

          const bool states[4] = {id(virtual_state_1), id(virtual_state_2),
                                  id(virtual_state_3), id(virtual_state_4)};
          std::vector<light::LightState *> *groups[2] = {&id(gb_lights_1), &id(gb_lights_2)};

          for (uint8_t i = 0; i < ${gang_count}; i++) {
            const bool on = states[i];
            const float r   = on ? (is_night ? id(vs_on_n_r)   : id(vs_on_r))
                                 : (is_night ? id(vs_off_n_r)   : id(vs_off_r));
            const float g   = on ? (is_night ? id(vs_on_n_g)   : id(vs_on_g))
                                 : (is_night ? id(vs_off_n_g)   : id(vs_off_g));
            const float b   = on ? (is_night ? id(vs_on_n_b)   : id(vs_on_b))
                                 : (is_night ? id(vs_off_n_b)   : id(vs_off_b));
            const float bri = on ? (is_night ? id(vs_on_n_bri) : id(vs_on_bri))
                                 : (is_night ? id(vs_off_n_bri) : id(vs_off_bri));

            for (auto *group : groups) {
              if (i >= group->size()) {
                continue;
              }
              auto *segment = (*group)[i];
              if (is_dark(r, g, b, bri)) {
                // Matches the wash, which is also dark for the same palette.
                segment->turn_off().set_transition_length(0).perform();
                continue;
              }
              auto call = segment->turn_on();
              call.set_rgb(r, g, b);
              call.set_brightness(bri);
              call.set_transition_length(0);
              call.perform();
            }
          }

  - id: !extend button_action
    parameters:
      button: uint8_t
      action: string
      count: uint8_t
    then:
      - lambda: |-
          if (action != "click" || count != 1) {
            return;
          }
          switch (button) {
            case 1:
              if (${gang_count} >= 1) id(virtual_switch_1).toggle();
              break;
            case 2:
              if (${gang_count} >= 2) id(virtual_switch_2).toggle();
              break;
            case 3:
              if (${gang_count} >= 3) id(virtual_switch_3).toggle();
              break;
            case 4:
              if (${gang_count} >= 4) id(virtual_switch_4).toggle();
              break;
          }
globals:
  - id: vs_on_r
    type: float
    restore_value: true
    initial_value: ${virtual_switch_on_red}
  - id: vs_on_g
    type: float
    restore_value: true
    initial_value: ${virtual_switch_on_green}
  - id: vs_on_b
    type: float
    restore_value: true
    initial_value: ${virtual_switch_on_blue}
  - id: vs_on_bri
    type: float
    restore_value: true
    initial_value: ${virtual_switch_on_brightness}

  - id: vs_off_r
    type: float
    restore_value: true
    initial_value: "1.0"
  - id: vs_off_g
    type: float
    restore_value: true
    initial_value: "1.0"
  - id: vs_off_b
    type: float
    restore_value: true
    initial_value: "1.0"
  - id: vs_off_bri
    type: float
    restore_value: true
    initial_value: "0.11"

  - id: vs_on_n_r
    type: float
    restore_value: true
    initial_value: "0.0"
  - id: vs_on_n_g
    type: float
    restore_value: true
    initial_value: "0.0"
  - id: vs_on_n_b
    type: float
    restore_value: true
    initial_value: "0.0"
  - id: vs_on_n_bri
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: vs_off_n_r
    type: float
    restore_value: true
    initial_value: "0.0"
  - id: vs_off_n_g
    type: float
    restore_value: true
    initial_value: "0.0"
  - id: vs_off_n_b
    type: float
    restore_value: true
    initial_value: "0.0"
  - id: vs_off_n_bri
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: virtual_state_1
    type: bool
    restore_value: true
    initial_value: "false"
  - id: virtual_state_2
    type: bool
    restore_value: true
    initial_value: "false"
  - id: virtual_state_3
    type: bool
    restore_value: true
    initial_value: "false"
  - id: virtual_state_4
    type: bool
    restore_value: true
    initial_value: "false"

switch:
  - platform: template
    name: "Virtual Switch 1"
    id: virtual_switch_1
    internal: ${gang_count < 1}
    lambda: "return id(virtual_state_1);"
    turn_on_action:
      - globals.set:
          id: virtual_state_1
          value: "true"
      - script.execute: vs_paint_lights
    turn_off_action:
      - globals.set:
          id: virtual_state_1
          value: "false"
      - script.execute: vs_paint_lights
  - platform: template
    name: "Virtual Switch 2"
    id: virtual_switch_2
    internal: ${gang_count < 2}
    lambda: "return id(virtual_state_2);"
    turn_on_action:
      - globals.set:
          id: virtual_state_2
          value: "true"
      - script.execute: vs_paint_lights
    turn_off_action:
      - globals.set:
          id: virtual_state_2
          value: "false"
      - script.execute: vs_paint_lights
  - platform: template
    name: "Virtual Switch 3"
    id: virtual_switch_3
    internal: ${gang_count < 3}
    lambda: "return id(virtual_state_3);"
    turn_on_action:
      - globals.set:
          id: virtual_state_3
          value: "true"
      - script.execute: vs_paint_lights
    turn_off_action:
      - globals.set:
          id: virtual_state_3
          value: "false"
      - script.execute: vs_paint_lights
  - platform: template
    name: "Virtual Switch 4"
    id: virtual_switch_4
    internal: ${gang_count < 4}
    lambda: "return id(virtual_state_4);"
    turn_on_action:
      - globals.set:
          id: virtual_state_4
          value: "true"
      - script.execute: vs_paint_lights
    turn_off_action:
      - globals.set:
          id: virtual_state_4
          value: "false"
      - script.execute: vs_paint_lights
