substitutions:
  virtual_switch_on_red: "0.0"
  virtual_switch_on_green: "0.2"
  virtual_switch_on_blue: "0.6"
  virtual_switch_on_brightness: "0.20"

output:
  - platform: template
    id: vs_on_red_out
    type: float
    write_action:
      - lambda: return;
  - platform: template
    id: vs_on_green_out
    type: float
    write_action:
      - lambda: return;
  - platform: template
    id: vs_on_blue_out
    type: float
    write_action:
      - lambda: return;
  - platform: template
    id: vs_off_red_out
    type: float
    write_action:
      - lambda: return;
  - platform: template
    id: vs_off_green_out
    type: float
    write_action:
      - lambda: return;
  - platform: template
    id: vs_off_blue_out
    type: float
    write_action:
      - lambda: return;

  - platform: template
    id: vs_on_n_red_out
    type: float
    write_action:
      - lambda: return;
  - platform: template
    id: vs_on_n_green_out
    type: float
    write_action:
      - lambda: return;
  - platform: template
    id: vs_on_n_blue_out
    type: float
    write_action:
      - lambda: return;
  - platform: template
    id: vs_off_n_red_out
    type: float
    write_action:
      - lambda: return;
  - platform: template
    id: vs_off_n_green_out
    type: float
    write_action:
      - lambda: return;
  - platform: template
    id: vs_off_n_blue_out
    type: float
    write_action:
      - lambda: return;

light:
  - platform: rgb
    name: "Virtual Switch On Color"
    id: vs_on_light
    red: vs_on_red_out
    green: vs_on_green_out
    blue: vs_on_blue_out
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 0ms
    on_state:
      then:
        - lambda: |-
            auto v = id(vs_on_light).current_values;
            if (v.get_brightness() > 0.0f) {
              id(vs_on_r) = v.get_red();
              id(vs_on_g) = v.get_green();
              id(vs_on_b) = v.get_blue();
              id(vs_on_bri) = v.get_brightness();
            }

  - platform: rgb
    name: "Virtual Switch Off Color"
    id: vs_off_light
    red: vs_off_red_out
    green: vs_off_green_out
    blue: vs_off_blue_out
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 0ms
    on_state:
      then:
        - lambda: |-
            auto v = id(vs_off_light).current_values;
            if (v.get_brightness() > 0.0f) {
              id(vs_off_r) = v.get_red();
              id(vs_off_g) = v.get_green();
              id(vs_off_b) = v.get_blue();
              id(vs_off_bri) = v.get_brightness();
            }

  - platform: rgb
    name: "Virtual Switch On Color Night"
    id: vs_on_light_night
    red: vs_on_n_red_out
    green: vs_on_n_green_out
    blue: vs_on_n_blue_out
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 0ms
    on_state:
      then:
        - lambda: |-
            auto v = id(vs_on_light_night).current_values;
            if (v.get_brightness() > 0.0f) {
              id(vs_on_n_r) = v.get_red();
              id(vs_on_n_g) = v.get_green();
              id(vs_on_n_b) = v.get_blue();
              id(vs_on_n_bri) = v.get_brightness();
            }

  - platform: rgb
    name: "Virtual Switch Off Color Night"
    id: vs_off_light_night
    red: vs_off_n_red_out
    green: vs_off_n_green_out
    blue: vs_off_n_blue_out
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 0ms
    on_state:
      then:
        - lambda: |-
            auto v = id(vs_off_light_night).current_values;
            if (v.get_brightness() > 0.0f) {
              id(vs_off_n_r) = v.get_red();
              id(vs_off_n_g) = v.get_green();
              id(vs_off_n_b) = v.get_blue();
              id(vs_off_n_bri) = v.get_brightness();
            }

  # Covers the entire strip. Used as a night-time background wash so the LEDs
  # that no gang owns are lit too; painted before the per-gang segments, which
  # then overwrite their own LEDs in the same buffer.
  - platform: partition
    name: "Virtual Switch Fill"
    id: vs_fill_light
    internal: true
    restore_mode: ALWAYS_OFF
    default_transition_length: 0ms
    segments:
      - id: light_full
        from: 0
        to: 31

time:
  - platform: sntp
    id: device_time
    timezone: America/Sao_Paulo
    on_time_sync:
      then:
        - script.execute: vs_paint_lights
    on_time:
      - seconds: 0
        minutes: 0
        hours: 20
        then:
          - script.execute: vs_paint_lights
      - seconds: 0
        minutes: 0
        hours: 8
        then:
          - script.execute: vs_paint_lights

script:
  # Single painter for every LED on the panel. Between 20:00 and 08:00 the night
  # palette replaces the day one and washes the whole strip; the per-gang segments
  # are then drawn on top so each relay keeps its own on/off indication.
  # Every write happens in one lambda, so the strip is shown once and never flickers.
  - id: vs_paint_lights
    mode: restart
    then:
      - lambda: |-
          auto now = id(device_time).now();
          const bool is_night = now.is_valid() && (now.hour >= 20 || now.hour < 8);

          // Background wash: night "off" colour at night, dark during the day.
          const float fill_bri = is_night ? id(vs_off_n_bri) : 0.0f;
          if (fill_bri > 0.0f) {
            auto call = id(vs_fill_light).turn_on();
            call.set_rgb(id(vs_off_n_r), id(vs_off_n_g), id(vs_off_n_b));
            call.set_brightness(fill_bri);
            call.set_transition_length(0);
            call.perform();
          } else {
            auto call = id(vs_fill_light).turn_off();
            call.set_transition_length(0);
            call.perform();
          }

          const bool states[4] = {id(virtual_state_1), id(virtual_state_2),
                                  id(virtual_state_3), id(virtual_state_4)};
          std::vector<light::LightState *> *groups[2] = {&id(gb_lights_1), &id(gb_lights_2)};

          for (uint8_t i = 0; i < ${gang_count}; i++) {
            const bool on = states[i];
            const float r   = on ? (is_night ? id(vs_on_n_r)   : id(vs_on_r))
                                 : (is_night ? id(vs_off_n_r)   : id(vs_off_r));
            const float g   = on ? (is_night ? id(vs_on_n_g)   : id(vs_on_g))
                                 : (is_night ? id(vs_off_n_g)   : id(vs_off_g));
            const float b   = on ? (is_night ? id(vs_on_n_b)   : id(vs_on_b))
                                 : (is_night ? id(vs_off_n_b)   : id(vs_off_b));
            const float bri = on ? (is_night ? id(vs_on_n_bri) : id(vs_on_bri))
                                 : (is_night ? id(vs_off_n_bri) : id(vs_off_bri));

            for (auto *group : groups) {
              if (i >= group->size()) {
                continue;
              }
              auto *segment = (*group)[i];
              if (bri <= 0.0f) {
                // Matches the wash, which is also dark whenever bri is 0.
                segment->turn_off().set_transition_length(0).perform();
                continue;
              }
              auto call = segment->turn_on();
              call.set_rgb(r, g, b);
              call.set_brightness(bri);
              call.set_transition_length(0);
              call.perform();
            }
          }

  - id: !extend button_action
    parameters:
      button: uint8_t
      action: string
      count: uint8_t
    then:
      - lambda: |-
          if (action != "click" || count != 1) {
            return;
          }
          switch (button) {
            case 1:
              if (${gang_count} >= 1) id(virtual_switch_1).toggle();
              break;
            case 2:
              if (${gang_count} >= 2) id(virtual_switch_2).toggle();
              break;
            case 3:
              if (${gang_count} >= 3) id(virtual_switch_3).toggle();
              break;
            case 4:
              if (${gang_count} >= 4) id(virtual_switch_4).toggle();
              break;
          }
globals:
  - id: vs_on_r
    type: float
    restore_value: true
    initial_value: ${virtual_switch_on_red}
  - id: vs_on_g
    type: float
    restore_value: true
    initial_value: ${virtual_switch_on_green}
  - id: vs_on_b
    type: float
    restore_value: true
    initial_value: ${virtual_switch_on_blue}
  - id: vs_on_bri
    type: float
    restore_value: true
    initial_value: ${virtual_switch_on_brightness}

  - id: vs_off_r
    type: float
    restore_value: true
    initial_value: "1.0"
  - id: vs_off_g
    type: float
    restore_value: true
    initial_value: "1.0"
  - id: vs_off_b
    type: float
    restore_value: true
    initial_value: "1.0"
  - id: vs_off_bri
    type: float
    restore_value: true
    initial_value: "0.11"

  - id: vs_on_n_r
    type: float
    restore_value: true
    initial_value: "0.0"
  - id: vs_on_n_g
    type: float
    restore_value: true
    initial_value: "0.0"
  - id: vs_on_n_b
    type: float
    restore_value: true
    initial_value: "0.0"
  - id: vs_on_n_bri
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: vs_off_n_r
    type: float
    restore_value: true
    initial_value: "0.0"
  - id: vs_off_n_g
    type: float
    restore_value: true
    initial_value: "0.0"
  - id: vs_off_n_b
    type: float
    restore_value: true
    initial_value: "0.0"
  - id: vs_off_n_bri
    type: float
    restore_value: true
    initial_value: "0.0"

  - id: virtual_state_1
    type: bool
    restore_value: true
    initial_value: "false"
  - id: virtual_state_2
    type: bool
    restore_value: true
    initial_value: "false"
  - id: virtual_state_3
    type: bool
    restore_value: true
    initial_value: "false"
  - id: virtual_state_4
    type: bool
    restore_value: true
    initial_value: "false"

switch:
  - platform: template
    name: "Virtual Switch 1"
    id: virtual_switch_1
    internal: ${gang_count < 1}
    lambda: "return id(virtual_state_1);"
    turn_on_action:
      - globals.set:
          id: virtual_state_1
          value: "true"
      - script.execute: vs_paint_lights
    turn_off_action:
      - globals.set:
          id: virtual_state_1
          value: "false"
      - script.execute: vs_paint_lights
  - platform: template
    name: "Virtual Switch 2"
    id: virtual_switch_2
    internal: ${gang_count < 2}
    lambda: "return id(virtual_state_2);"
    turn_on_action:
      - globals.set:
          id: virtual_state_2
          value: "true"
      - script.execute: vs_paint_lights
    turn_off_action:
      - globals.set:
          id: virtual_state_2
          value: "false"
      - script.execute: vs_paint_lights
  - platform: template
    name: "Virtual Switch 3"
    id: virtual_switch_3
    internal: ${gang_count < 3}
    lambda: "return id(virtual_state_3);"
    turn_on_action:
      - globals.set:
          id: virtual_state_3
          value: "true"
      - script.execute: vs_paint_lights
    turn_off_action:
      - globals.set:
          id: virtual_state_3
          value: "false"
      - script.execute: vs_paint_lights
  - platform: template
    name: "Virtual Switch 4"
    id: virtual_switch_4
    internal: ${gang_count < 4}
    lambda: "return id(virtual_state_4);"
    turn_on_action:
      - globals.set:
          id: virtual_state_4
          value: "true"
      - script.execute: vs_paint_lights
    turn_off_action:
      - globals.set:
          id: virtual_state_4
          value: "false"
      - script.execute: vs_paint_lights
